name: Append hello world

on:
  schedule:
    # UTC; Asia/Shanghai: 07:00, 12:01, 17:02, 22:03.
    - cron: '0 23 * * *'
    - cron: '1 4 * * *'
    - cron: '2 9 * * *'
    - cron: '3 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hello-${{ github.repository }}
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Append and push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Retry if another writer updates the default branch concurrently.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEFAULT_BRANCH"
            git reset --hard "origin/$DEFAULT_BRANCH"
            python3 - <<'PY'
          from pathlib import Path
          path = Path('hello.txt')
          existing = path.read_bytes() if path.exists() else b''
          with path.open('ab') as file:
              if existing and not existing.endswith(b'\n'):
                  file.write(b'\n')
              file.write(b'hello world\n')
          PY
            git add -- hello.txt
            git commit -m 'Append hello world'
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi
          done
          echo 'Failed to push after five attempts' >&2
          exit 1
